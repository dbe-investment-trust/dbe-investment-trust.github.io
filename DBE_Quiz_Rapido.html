<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Financiero Rápido — DBE Financial Club</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#070E18;color:#fff;font-family:'DM Sans',sans-serif;min-height:100vh;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(7,14,24,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,168,76,.1);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;}
.nav-logo{font-family:'Playfair Display',serif;font-size:14px;color:#F0D78C;}
.nav-back{font-size:12px;color:rgba(255,255,255,.4);text-decoration:none;}
.game-container{padding-top:72px;padding-bottom:40px;max-width:600px;margin:0 auto;padding-left:20px;padding-right:20px;}
/* Timer bar */
#timerBar{height:5px;background:rgba(201,168,76,.15);border-radius:4px;margin-bottom:24px;overflow:hidden;}
#timerFill{height:100%;background:linear-gradient(90deg,#C9A84C,#F0D78C);border-radius:4px;transition:width .1s linear;width:100%;}
/* Score header */
.score-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.score-badge{font-family:'Playfair Display',serif;font-size:28px;color:#F0D78C;}
.q-counter{font-size:12px;color:rgba(255,255,255,.3);letter-spacing:1px;}
/* Question */
.question-card{background:linear-gradient(135deg,rgba(13,27,42,.95),rgba(22,36,54,.95));border:1px solid rgba(201,168,76,.15);border-radius:16px;padding:24px;margin-bottom:20px;}
.q-category{font-size:10px;letter-spacing:2px;color:#C9A84C;margin-bottom:8px;display:block;}
.q-text{font-family:'Playfair Display',serif;font-size:clamp(15px,3vw,19px);color:#fff;line-height:1.45;}
/* Options */
.options{display:flex;flex-direction:column;gap:10px;}
.opt{padding:14px 18px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:12px;cursor:pointer;font-size:14px;color:rgba(255,255,255,.8);transition:all .15s;text-align:left;}
.opt:hover{background:rgba(201,168,76,.08);border-color:rgba(201,168,76,.3);color:#fff;}
.opt.correct{background:rgba(46,204,138,.15);border-color:#2ECC8A;color:#2ECC8A;font-weight:700;}
.opt.wrong{background:rgba(231,76,111,.12);border-color:#E74C6F;color:#E74C6F;}
.opt:disabled{cursor:default;pointer-events:none;}
/* Feedback */
#feedback{margin-top:14px;padding:12px 16px;border-radius:10px;font-size:13px;line-height:1.6;display:none;}
#feedback.correct{background:rgba(46,204,138,.1);border:1px solid rgba(46,204,138,.25);color:#2ECC8A;}
#feedback.wrong{background:rgba(231,76,111,.1);border:1px solid rgba(231,76,111,.25);color:#EF9A9A;}
/* Result */
#resultScreen{display:none;text-align:center;padding:40px 0;}
#resultScreen h1{font-family:'Playfair Display',serif;font-size:clamp(24px,5vw,40px);color:#F0D78C;margin-bottom:8px;}
.big-score{font-family:'Playfair Display',serif;font-size:72px;color:#F0D78C;}
.big-label{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:2px;margin-bottom:16px;display:block;}
.result-msg{font-size:15px;color:rgba(255,255,255,.6);max-width:320px;margin:0 auto 28px;line-height:1.7;}
.stats-row{display:flex;justify-content:center;gap:32px;margin-bottom:28px;}
.stat{text-align:center;}
.stat-num{font-family:'Playfair Display',serif;font-size:28px;color:#fff;}
.stat-lbl{font-size:11px;color:rgba(255,255,255,.3);letter-spacing:1px;}
.btn-gold{padding:14px 36px;background:linear-gradient(135deg,#C9A84C,#F0D78C);color:#0D1B2A;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'Playfair Display',serif;cursor:pointer;box-shadow:0 6px 24px rgba(201,168,76,.3);margin:4px;}
.btn-ghost{padding:12px 28px;background:transparent;border:1px solid rgba(201,168,76,.3);color:#C9A84C;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin:4px;}
#startScreen{text-align:center;padding:40px 0;}
#startScreen h1{font-family:'Playfair Display',serif;font-size:clamp(24px,5vw,38px);color:#F0D78C;margin-bottom:12px;}
#startScreen p{font-size:14px;color:rgba(255,255,255,.5);max-width:340px;margin:0 auto 28px;line-height:1.7;}
.diff-btn{padding:10px 24px;border:1px solid rgba(201,168,76,.25);background:rgba(201,168,76,.06);color:#C9A84C;border-radius:10px;font-size:13px;cursor:pointer;margin:4px;transition:all .2s;}
.diff-btn.active{background:rgba(201,168,76,.2);border-color:#C9A84C;color:#F0D78C;font-weight:700;}
</style>
</head>
<body>
<nav><div class="nav-logo">DBE Financial Club</div><a href="DBE_Juegos_Mentales.html" class="nav-back">← Juegos</a></nav>

<div class="game-container">
  <div id="startScreen">
    <h1>Quiz Financiero Rápido</h1>
    <p>Responde 10 preguntas de finanzas personales e inversiones antes de que se acabe el tiempo. ¡Cada segundo cuenta!</p>
    <div style="margin-bottom:20px;">
      <button class="diff-btn active" id="d-facil" onclick="setDiff('facil')">Fácil · 20s</button>
      <button class="diff-btn" id="d-medio" onclick="setDiff('medio')">Medio · 15s</button>
      <button class="diff-btn" id="d-dificil" onclick="setDiff('dificil')">Difícil · 10s</button>
    </div>
    <button class="btn-gold" onclick="startGame()">Comenzar quiz</button>
  </div>

  <div id="quizScreen" style="display:none;">
    <div id="timerBar"><div id="timerFill"></div></div>
    <div class="score-row">
      <div><span class="q-counter" id="qCounter">Pregunta 1 de 10</span></div>
      <div class="score-badge" id="scoreDisplay">0 pts</div>
    </div>
    <div class="question-card">
      <span class="q-category" id="qCategory">Finanzas personales</span>
      <p class="q-text" id="qText"></p>
    </div>
    <div class="options" id="optionsContainer"></div>
    <div id="feedback"></div>
  </div>

  <div id="resultScreen">
    <h1>Resultado final</h1>
    <div class="big-score" id="finalPts">0</div>
    <span class="big-label">PUNTOS</span>
    <div class="stats-row">
      <div class="stat"><div class="stat-num" id="statCorrect">0</div><div class="stat-lbl">Correctas</div></div>
      <div class="stat"><div class="stat-num" id="statWrong">0</div><div class="stat-lbl">Incorrectas</div></div>
      <div class="stat"><div class="stat-num" id="statTime">0s</div><div class="stat-lbl">Promedio</div></div>
    </div>
    <p class="result-msg" id="resultMsg"></p>
    <button class="btn-gold" onclick="startGame()">Jugar de nuevo</button>
    <button class="btn-ghost" onclick="window.location.href='DBE_Juegos_Mentales.html'">Ver otros juegos</button>
  </div>
</div>

<script>
const APPS_URL='https://script.google.com/macros/s/AKfycbyq_ePrj-G2lEepCe3ARO8OMg6tYiqksXTr6aV_ywhjZ7lJeZTGUeVPAPMMcTzagsUW8w/exec';
firebase.initializeApp({apiKey:"AIzaSyAybxQJFeFizBYZ5Y_pqBGONs_cErSXfJs",authDomain:"dbe-financial-club.firebaseapp.com",projectId:"dbe-financial-club",storageBucket:"dbe-financial-club.firebasestorage.app",messagingSenderId:"1001600683639",appId:"1:1001600683639:web:f1a6645b6f24df09c50072"});
var _user=null;firebase.auth().onAuthStateChanged(function(u){_user=u;});

var QUESTIONS=[
  {cat:'Ahorro',q:'¿Cuántos meses de gastos se recomienda tener en un fondo de emergencia?',opts:['1 mes','3-6 meses','12 meses','24 meses'],ans:1,exp:'3 a 6 meses es el estándar recomendado para cubrir imprevistos sin endeudarte.'},
  {cat:'Inversión',q:'¿Qué es el interés compuesto?',opts:['Interés que se paga al banco','Interés sobre el capital más los intereses acumulados','Interés fijo anual','Comisión bancaria'],ans:1,exp:'Einstein lo llamó "la octava maravilla": ganas intereses sobre tus intereses, multiplicando tu riqueza exponencialmente.'},
  {cat:'Deuda',q:'¿Cuál es la estrategia "bola de nieve" para pagar deudas?',opts:['Pagar las deudas más grandes primero','Pagar las deudas con mayor tasa de interés primero','Pagar la deuda más pequeña primero para ganar impulso','Pagar todas las deudas en cuotas iguales'],ans:2,exp:'Empezar por la deuda más pequeña te da victorias rápidas y motivación para seguir.'},
  {cat:'Inversión',q:'¿Qué significa diversificar un portafolio?',opts:['Invertir todo en una sola acción','Distribuir el capital en distintos activos para reducir riesgo','Cambiar de inversión cada semana','Invertir solo en divisas extranjeras'],ans:1,exp:'No poner todos los huevos en una sola canasta. Si un activo cae, los demás amortiguan la pérdida.'},
  {cat:'Finanzas personales',q:'La regla 50/30/20 del presupuesto establece:',opts:['50% ahorro, 30% gastos, 20% inversión','50% necesidades, 30% deseos, 20% ahorro','50% inversión, 30% necesidades, 20% deudas','50% trabajo, 30% familia, 20% ocio'],ans:1,exp:'50% para necesidades básicas, 30% para gustos y ocio, 20% para ahorro e inversiones.'},
  {cat:'Mercados',q:'¿Qué es un ETF?',opts:['Un tipo de criptomoneda','Un fondo de inversión cotizado en bolsa','Una cuenta de ahorros de alta rentabilidad','Un préstamo bancario especial'],ans:1,exp:'Exchange Traded Fund: un fondo que replica un índice y se compra/vende en bolsa como una acción. Fácil y diversificado.'},
  {cat:'Inflación',q:'Si la inflación es del 10% anual y tu ahorro gana 5%, ¿qué pasa con tu poder adquisitivo?',opts:['Aumenta un 5%','Se mantiene igual','Disminuye aproximadamente un 5%','Se duplica'],ans:2,exp:'Tu dinero pierde poder de compra si el rendimiento no supera la inflación. ¡Por eso invertir es vital!'},
  {cat:'Mentalidad',q:'Según Morgan Housel, la riqueza es principalmente:',opts:['Tener el mejor carro','Lo que no ves — ahorro acumulado en silencio','Ganar un salario alto','Trabajar más horas'],ans:1,exp:'La riqueza real es invisible: son los activos no gastados, los ahorros, las inversiones calladas.'},
  {cat:'Colombia',q:'¿Qué es un CDT en Colombia?',opts:['Certificado de Depósito a Término — ahorro con rentabilidad fija','Cuenta de Débito Total','Crédito de Deuda Temporal','Cuenta de Dividendos Tributarios'],ans:0,exp:'El CDT es uno de los instrumentos más seguros en Colombia: depositas por un plazo fijo y recibes una tasa garantizada.'},
  {cat:'Inversión',q:'¿Cuál es la diferencia entre riesgo y volatilidad?',opts:['Son exactamente lo mismo','La volatilidad es el movimiento del precio; el riesgo es perder permanentemente','El riesgo es temporal; la volatilidad es permanente','No tienen relación'],ans:1,exp:'La volatilidad es normal en los mercados. El verdadero riesgo es perder el capital de forma permanente — generalmente por vender en el pánico.'},
  {cat:'Finanzas personales',q:'¿Qué es el "efecto latte" en finanzas personales?',opts:['Invertir en cafeterías','Los pequeños gastos diarios que acumulados impactan enormemente el ahorro','Un tipo de inversión en commodities','Una estrategia de ahorro colombiana'],ans:1,exp:'Ese café diario de $8.000 COP son $240.000 al mes y $2.88 millones al año. Los pequeños hábitos definen el futuro financiero.'},
  {cat:'Inversión',q:'¿Qué es el "costo promedio en dólares" (DCA)?',opts:['Cambiar divisas frecuentemente','Invertir una cantidad fija periódicamente sin importar el precio del mercado','Calcular el costo total de una inversión','Promediar pérdidas de múltiples inversiones'],ans:1,exp:'DCA te protege de intentar "adivinar" el mercado: inviertes el mismo monto cada mes, comprando más cuando baja y menos cuando sube.'},
  {cat:'Mentalidad',q:'¿Cuál es la principal diferencia entre un activo y un pasivo?',opts:['Los activos cuestan más','Los activos te ponen dinero en el bolsillo; los pasivos te lo sacan','Los pasivos son siempre deudas','No hay diferencia práctica'],ans:1,exp:'Definición de Robert Kiyosaki. Un carro propio es pasivo (gastos). Un carro de alquiler que genera ingresos es activo.'},
  {cat:'Mercados',q:'Si compras una acción a $100 y sube a $150, ¿cuál es tu rentabilidad?',opts:['25%','40%','50%','60%'],ans:2,exp:'($150-$100)/$100 = 50%. Siempre calcula la rentabilidad sobre el capital invertido, no el valor final.'},
  {cat:'Colombia',q:'¿Qué plataforma colombiana permite invertir en fondos desde $100.000 COP?',opts:['Solo los bancos tradicionales','Fiduciarias como Bancolombia o Credicorp','Solo la Bolsa de Valores de Colombia directamente','Únicamente con asesor financiero presencial'],ans:1,exp:'Las fiduciarias colombianas democratizan la inversión. Hoy puedes invertir en fondos diversificados desde montos muy bajos.'},
];

var diff='facil';
var TIME_LIMITS={facil:20,medio:15,dificil:10};
var state={};
var timerInterval=null;

function setDiff(d){
  diff=d;
  document.querySelectorAll('.diff-btn').forEach(function(b){b.classList.remove('active');});
  document.getElementById('d-'+d).classList.add('active');
}

function shuffle(arr){
  var a=arr.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function startGame(){
  document.getElementById('startScreen').style.display='none';
  document.getElementById('resultScreen').style.display='none';
  document.getElementById('quizScreen').style.display='block';
  state={
    questions:shuffle(QUESTIONS).slice(0,10),
    current:0, score:0, correct:0, wrong:0,
    timeLimit:TIME_LIMITS[diff],
    timeLeft:TIME_LIMITS[diff],
    totalTime:0, answered:false
  };
  showQuestion();
}

function showQuestion(){
  if(state.current>=state.questions.length){endGame();return;}
  var q=state.questions[state.current];
  state.answered=false;
  state.timeLeft=state.timeLimit;

  document.getElementById('qCounter').textContent='Pregunta '+(state.current+1)+' de '+state.questions.length;
  document.getElementById('qCategory').textContent=q.cat.toUpperCase();
  document.getElementById('qText').textContent=q.q;
  document.getElementById('feedback').style.display='none';
  document.getElementById('timerFill').style.width='100%';
  document.getElementById('timerFill').style.background='linear-gradient(90deg,#C9A84C,#F0D78C)';

  var opts=document.getElementById('optionsContainer');
  opts.innerHTML='';
  q.opts.forEach(function(opt,i){
    var btn=document.createElement('button');
    btn.className='opt';
    btn.textContent=opt;
    btn.onclick=function(){answer(i);};
    opts.appendChild(btn);
  });

  if(timerInterval)clearInterval(timerInterval);
  var startTime=Date.now();
  timerInterval=setInterval(function(){
    state.timeLeft-=0.1;
    var pct=Math.max(0,state.timeLeft/state.timeLimit*100);
    document.getElementById('timerFill').style.width=pct+'%';
    if(pct<30)document.getElementById('timerFill').style.background='#E74C6F';
    else if(pct<60)document.getElementById('timerFill').style.background='#E67E22';
    if(state.timeLeft<=0){
      clearInterval(timerInterval);
      if(!state.answered)timeOut();
    }
  },100);
}

function answer(idx){
  if(state.answered)return;
  state.answered=true;
  clearInterval(timerInterval);
  var q=state.questions[state.current];
  var timeUsed=state.timeLimit-state.timeLeft;
  state.totalTime+=timeUsed;

  var opts=document.querySelectorAll('.opt');
  opts.forEach(function(b){b.disabled=true;});

  var fb=document.getElementById('feedback');
  if(idx===q.ans){
    opts[idx].classList.add('correct');
    var pts=Math.round(100+Math.max(0,(state.timeLimit-timeUsed)/state.timeLimit*100));
    state.score+=pts;
    state.correct++;
    fb.className='correct';
    fb.innerHTML='<strong>+'+pts+' pts</strong> — '+q.exp;
    document.getElementById('scoreDisplay').textContent=state.score+' pts';
  } else {
    opts[idx].classList.add('wrong');
    opts[q.ans].classList.add('correct');
    state.wrong++;
    fb.className='wrong';
    fb.innerHTML='<strong>Incorrecto.</strong> '+q.exp;
  }
  fb.style.display='block';

  setTimeout(function(){
    state.current++;
    showQuestion();
  },2200);
}

function timeOut(){
  if(state.answered)return;
  state.answered=true;
  var q=state.questions[state.current];
  var opts=document.querySelectorAll('.opt');
  opts.forEach(function(b){b.disabled=true;});
  opts[q.ans].classList.add('correct');
  state.wrong++;
  var fb=document.getElementById('feedback');
  fb.className='wrong';
  fb.innerHTML='<strong>Tiempo agotado.</strong> '+q.exp;
  fb.style.display='block';
  setTimeout(function(){state.current++;showQuestion();},2000);
}

function endGame(){
  document.getElementById('quizScreen').style.display='none';
  document.getElementById('resultScreen').style.display='block';
  document.getElementById('finalPts').textContent=state.score;
  document.getElementById('statCorrect').textContent=state.correct;
  document.getElementById('statWrong').textContent=state.wrong;
  document.getElementById('statTime').textContent=Math.round(state.totalTime/state.questions.length)+'s';
  var pct=state.correct/state.questions.length;
  document.getElementById('resultMsg').textContent=
    pct>=0.9?'¡Experto financiero! Tienes mentalidad DBE completa.':
    pct>=0.7?'Excelente. Sigues construyendo tu educación financiera.':
    pct>=0.5?'Buen avance. Hay conceptos clave por reforzar.':
    'El conocimiento es poder. Sigue aprendiendo con DBE.';
  if(_user){fetch(APPS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({tipo:'ENGAGEMENT',email:_user.email,nombre:_user.displayName||_user.email.split('@')[0],notas:'Juego: Quiz Financiero — Score: '+state.score+' pts — '+state.correct+'/10 correctas',fuente:'Mental Gym',fecha_registro:new Date().toLocaleString('es-CO',{timeZone:'America/Bogota'})})});}
}
</script>
</body>
</html>
