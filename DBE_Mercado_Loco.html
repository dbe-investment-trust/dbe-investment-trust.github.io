<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Mercado Loco — DBE Financial Club</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#070E18;color:#fff;font-family:'DM Sans',sans-serif;overflow:hidden;height:100vh;user-select:none;}
nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(7,14,24,.9);backdrop-filter:blur(10px);border-bottom:1px solid rgba(201,168,76,.1);display:flex;align-items:center;justify-content:space-between;padding:0 20px;height:52px;}
.nav-logo{font-family:'Playfair Display',serif;font-size:14px;color:#F0D78C;}
.nav-back{font-size:12px;color:rgba(255,255,255,.4);text-decoration:none;}
#gameWrapper{position:fixed;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column;}
#hud{display:flex;align-items:center;justify-content:space-between;padding:10px 20px;background:rgba(13,27,42,.8);border-bottom:1px solid rgba(201,168,76,.1);flex-shrink:0;}
.hud-item{text-align:center;}
.hud-label{font-size:9px;letter-spacing:1.5px;color:rgba(255,255,255,.3);text-transform:uppercase;display:block;}
.hud-value{font-family:'Playfair Display',serif;font-size:20px;color:#F0D78C;}
#gameCanvas{flex:1;display:block;width:100%;}
.overlay{position:absolute;top:52px;left:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(7,14,24,.92);backdrop-filter:blur(8px);z-index:50;padding:24px;}
.overlay h1{font-family:'Playfair Display',serif;font-size:clamp(22px,5vw,38px);color:#F0D78C;margin-bottom:8px;text-align:center;}
.overlay p{font-size:14px;color:rgba(255,255,255,.5);text-align:center;line-height:1.7;max-width:340px;margin-bottom:24px;}
.big-score{font-family:'Playfair Display',serif;font-size:64px;color:#F0D78C;margin-bottom:4px;}
.big-label{font-size:12px;color:rgba(255,255,255,.3);margin-bottom:24px;letter-spacing:2px;}
.btn-gold{padding:14px 36px;background:linear-gradient(135deg,#C9A84C,#F0D78C);color:#0D1B2A;border:none;border-radius:12px;font-size:15px;font-weight:700;font-family:'Playfair Display',serif;cursor:pointer;box-shadow:0 6px 24px rgba(201,168,76,.3);}
.btn-ghost{padding:12px 28px;background:transparent;border:1px solid rgba(201,168,76,.3);color:#C9A84C;border-radius:12px;font-size:14px;font-weight:600;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>
<nav><div class="nav-logo">DBE Financial Club</div><a href="DBE_Juegos_Mentales.html" class="nav-back">← Juegos</a></nav>

<div class="overlay" id="startScreen">
  <h1>El Mercado Loco</h1>
  <p>Estilo Flappy Bird. Navega tu inversión entre las volatilidades del mercado. ¡No dejes que el pánico te haga caer!</p>
  <p style="font-size:12px;color:rgba(255,255,255,.3);">Tap / Espacio / Clic para rebotar</p>
  <button class="btn-gold" onclick="startGame()">Invertir ahora</button>
</div>

<div class="overlay" id="gameOverScreen" style="display:none;">
  <h1>Mercado cerrado</h1>
  <div class="big-score" id="finalScore">0</div>
  <div class="big-label">VELAS SUPERADAS</div>
  <p id="finalMsg"></p>
  <button class="btn-gold" onclick="startGame()">Reinvertir</button>
  <button class="btn-ghost" onclick="window.location.href='DBE_Juegos_Mentales.html'">Ver otros juegos</button>
</div>

<div id="gameWrapper">
  <div id="hud">
    <div class="hud-item"><span class="hud-label">Velas</span><span class="hud-value" id="hudScore">0</span></div>
    <div class="hud-item"><span class="hud-label">Mejor</span><span class="hud-value" id="hudBest">0</span></div>
    <div class="hud-item"><span class="hud-label">Velocidad</span><span class="hud-value" id="hudSpeed">1x</span></div>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<script>
const APPS_URL='https://script.google.com/macros/s/AKfycbyq_ePrj-G2lEepCe3ARO8OMg6tYiqksXTr6aV_ywhjZ7lJeZTGUeVPAPMMcTzagsUW8w/exec';
firebase.initializeApp({apiKey:"AIzaSyAybxQJFeFizBYZ5Y_pqBGONs_cErSXfJs",authDomain:"dbe-financial-club.firebaseapp.com",projectId:"dbe-financial-club",storageBucket:"dbe-financial-club.firebasestorage.app",messagingSenderId:"1001600683639",appId:"1:1001600683639:web:f1a6645b6f24df09c50072"});
var _user=null;firebase.auth().onAuthStateChanged(function(u){_user=u;});

var canvas=document.getElementById('gameCanvas');
var ctx=canvas.getContext('2d');
function resize(){canvas.width=canvas.offsetWidth;canvas.height=canvas.offsetHeight;}
window.addEventListener('resize',resize);resize();

var best=0;
var state={};var animId=null;

function flap(){if(state.running){state.vy=-8;}}

document.addEventListener('keydown',function(e){if(e.code==='Space'){e.preventDefault();flap();}});
canvas.addEventListener('click',flap);
canvas.addEventListener('touchstart',function(e){e.preventDefault();flap();},{passive:false});

function startGame(){
  resize();
  document.getElementById('startScreen').style.display='none';
  document.getElementById('gameOverScreen').style.display='none';
  var W=canvas.width,H=canvas.height;
  state={
    running:true,
    score:0,
    bird:{x:W*0.2,y:H/2,r:18,vy:0,rotation:0},
    pipes:[],
    particles:[],
    speed:3,
    pipeTimer:0,
    pipeInterval:90,
    gap:Math.min(180,H*0.35),
    frame:0
  };
  if(animId)cancelAnimationFrame(animId);
  loop();
}

function loop(){
  if(!state.running)return;
  update();draw();
  animId=requestAnimationFrame(loop);
}

var EVENTS=['📈 Bull run!','📉 Corrección','🏦 Fed sube tasas','💹 Mercado alcista','⚡ Flash crash','🌊 Volatilidad'];

function update(){
  var W=canvas.width,H=canvas.height;
  state.frame++;
  state.bird.vy+=0.45;
  state.bird.y+=state.bird.vy;
  state.bird.rotation=Math.min(Math.PI/3,Math.max(-Math.PI/4,state.bird.vy*0.08));

  // Speed up
  state.speed=3+state.score*0.08;
  document.getElementById('hudSpeed').textContent=state.speed.toFixed(1)+'x';

  // Spawn pipes
  state.pipeTimer++;
  if(state.pipeTimer>=state.pipeInterval){
    state.pipeTimer=0;
    var gapY=state.gap/2+Math.random()*(H-state.gap-80)+40;
    var event=EVENTS[Math.floor(Math.random()*EVENTS.length)];
    state.pipes.push({x:W+20,gapY:gapY,gap:state.gap,counted:false,color:Math.random()>.5?'#2ECC8A':'#E74C6F',event:event});
  }

  // Update pipes
  for(var i=state.pipes.length-1;i>=0;i--){
    var p=state.pipes[i];
    p.x-=state.speed;
    // Score
    if(!p.counted&&p.x+20<state.bird.x){
      p.counted=true;
      state.score++;
      document.getElementById('hudScore').textContent=state.score;
      if(state.score>best){best=state.score;document.getElementById('hudBest').textContent=best;}
      state.particles.push({x:state.bird.x,y:state.bird.y,vx:2,vy:-3,alpha:1,color:'#F0D78C',text:'+1',size:3});
    }
    // Collision
    var b=state.bird;
    if(b.x+b.r>p.x&&b.x-b.r<p.x+50){
      if(b.y-b.r<p.gapY-p.gap/2||b.y+b.r>p.gapY+p.gap/2){endGame();return;}
    }
    if(p.x+50<0)state.pipes.splice(i,1);
  }

  // Wall collision
  if(state.bird.y-state.bird.r<0||state.bird.y+state.bird.r>H){endGame();return;}

  // Particles
  for(var j=state.particles.length-1;j>=0;j--){
    var pt=state.particles[j];
    pt.x+=pt.vx;pt.y+=pt.vy;pt.alpha-=0.03;
    if(pt.alpha<=0)state.particles.splice(j,1);
  }
}

function draw(){
  var W=canvas.width,H=canvas.height;
  // Sky gradient
  var sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#050C18');sky.addColorStop(1,'#0D1B2A');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H);

  // Grid
  ctx.strokeStyle='rgba(201,168,76,.04)';ctx.lineWidth=1;
  for(var x=0;x<W;x+=60){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(var y=0;y<H;y+=60){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

  // Pipes (candlesticks style)
  state.pipes.forEach(function(p){
    var isGreen=p.color==='#2ECC8A';
    // Top candle
    ctx.shadowColor=p.color;ctx.shadowBlur=12;
    ctx.fillStyle=p.color+'44';
    ctx.fillRect(p.x,0,50,p.gapY-p.gap/2);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x+10,0,30,p.gapY-p.gap/2);
    // Bottom candle
    ctx.fillStyle=p.color+'44';
    ctx.fillRect(p.x,p.gapY+p.gap/2,50,H-(p.gapY+p.gap/2));
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x+10,p.gapY+p.gap/2,30,H-(p.gapY+p.gap/2));
    ctx.shadowBlur=0;
    // Event label
    ctx.font='10px DM Sans';ctx.fillStyle='rgba(255,255,255,.4)';
    ctx.textAlign='center';ctx.textBaseline='top';
    ctx.fillText(p.event,p.x+25,p.gapY-p.gap/2+6);
  });

  // Bird (coin/investment)
  var b=state.bird;
  ctx.save();
  ctx.translate(b.x,b.y);
  ctx.rotate(b.rotation);
  // Outer glow
  ctx.shadowColor='rgba(201,168,76,.7)';ctx.shadowBlur=20;
  // Circle
  var grd=ctx.createRadialGradient(0,-b.r*.2,1,0,0,b.r);
  grd.addColorStop(0,'#F0D78C');grd.addColorStop(1,'#C9A84C');
  ctx.beginPath();ctx.arc(0,0,b.r,0,Math.PI*2);
  ctx.fillStyle=grd;ctx.fill();
  ctx.shadowBlur=0;
  // DBE text
  ctx.font='bold 9px Playfair Display,serif';ctx.fillStyle='#0D1B2A';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('DBE',0,0);
  ctx.restore();

  // Particles
  state.particles.forEach(function(pt){
    ctx.globalAlpha=pt.alpha;
    ctx.font='bold 14px DM Sans';ctx.fillStyle=pt.color;
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(pt.text,pt.x,pt.y);
    ctx.globalAlpha=1;
  });
}

function endGame(){
  state.running=false;
  cancelAnimationFrame(animId);
  var score=state.score;
  document.getElementById('finalScore').textContent=score;
  document.getElementById('finalMsg').textContent=score>=20?'¡Navegaste el mercado como un experto!':score>=10?'Buen instinto. La práctica hace al maestro.':'El mercado es volátil. ¡Sigue intentando!';
  document.getElementById('gameOverScreen').style.display='flex';
  if(_user){fetch(APPS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain'},body:JSON.stringify({tipo:'ENGAGEMENT',email:_user.email,nombre:_user.displayName||_user.email.split('@')[0],notas:'Juego: El Mercado Loco — Score: '+score+' velas',fuente:'Mental Gym',fecha_registro:new Date().toLocaleString('es-CO',{timeZone:'America/Bogota'})})});}
}
</script>
</body>
</html>
